# NOTE: production traffic (app.sala-global.com) is served by "sala_global_fs",
# a web service created manually in the Render dashboard before this blueprint
# existed. It is intentionally NOT declared here, so this blueprint's autoSync
# does not touch it. This blueprint previously also declared a second, duplicate
# "sala-streamlit-app" web service with the same startCommand pointed at the
# same repo/branch - it never had DATABASE_URL or the other required secrets
# configured, so it could not serve real traffic. It has been removed below and
# deleted from Render to stop double-billing/redeploying a dead service.
services:
  - type: pserv
    name: sala-pdf-service
    runtime: docker
    rootDir: .
    dockerfilePath: Dockerfile
    envVars:
      - key: PDF_SERVICE_HOST
        value: 0.0.0.0
      - key: PDF_SERVICE_PORT
        value: 8765

databases:
  - name: sala-postgres
